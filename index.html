<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今日活动建议 - 第一版</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f7d5b'/%3E%3Cpath d='M8 17h4l2-6 3 10 2-4h5' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>今日活动建议</h1>
      <p>输入久坐、睡眠、心率、步数，按固定规则给出今天最合适的活动安排。</p>
    </header>

    <section class="form-card" aria-label="输入数据">
      <div class="field">
        <label for="sedentary">久坐时长（小时）</label>
        <input type="number" id="sedentary" inputmode="decimal" placeholder="如 7" min="0" step="0.1" required>
      </div>
      <div class="field">
        <label for="sleep">睡眠时长（小时）</label>
        <input type="number" id="sleep" inputmode="decimal" placeholder="如 6.5" min="0" step="0.1" required>
      </div>
      <div class="field">
        <label for="hr">静息心率（次/分钟）</label>
        <input type="number" id="hr" inputmode="numeric" placeholder="如 65" min="0" step="1">
        <p class="field-hint">不知道就留空</p>
      </div>
      <div class="field">
        <label for="steps">每日步数（步）</label>
        <input type="number" id="steps" inputmode="numeric" placeholder="如 6000" min="0" step="1" required>
      </div>
      <button type="button" id="generateBtn">生成今天的建议</button>
      <p id="formError" class="form-error" role="alert" hidden></p>
    </section>

    <section class="result" id="result" hidden aria-live="polite">
      <div class="result-block">
        <h2>活动建议</h2>
        <p id="activityAdvice"></p>
      </div>
      <div class="result-block">
        <h2>今天最该做的一件事</h2>
        <p id="keyAdvice"></p>
      </div>
      <p class="match-info" id="matchInfo"></p>
    </section>

    <footer class="app-footer">
      <p>本工具只做固定规则判断，不构成医疗建议。</p>
      <p><a href="about.html">关于这个工具</a></p>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
