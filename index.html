<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今日活动建议 - 第一版</title>
  <link rel="stylesheet" href="style.css?v=7">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f7d5b'/%3E%3Cpath d='M8 17h4l2-6 3 10 2-4h5' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <!-- Open Graph：分享到微信/社交平台时展示的标题、简介和缩略图 -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:site_name" content="今日活动建议">
  <meta property="og:title" content="今日活动建议 — 告诉你今天该做什么、不该做什么">
  <meta property="og:description" content="输入久坐、睡眠、心率、步数四个数字，按固定规则给出今天最合适的活动安排。久坐人群的数据翻译，不接AI、不猜、不编。">
  <meta property="og:url" content="https://jiaozuo-ren.github.io/shift-health-v1/">
  <meta property="og:image" content="https://jiaozuo-ren.github.io/shift-health-v1/og-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="今日活动建议：久坐人群的数据翻译">
  <!-- Twitter / X 卡片 -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="今日活动建议 — 告诉你今天该做什么、不该做什么">
  <meta name="twitter:description" content="输入久坐、睡眠、心率、步数四个数字，按固定规则给出今天最合适的活动安排。">
  <meta name="twitter:image" content="https://jiaozuo-ren.github.io/shift-health-v1/og-preview.png">
  <!-- 提示：og:url 与 og:image 里的域名/路径，部署后请按实际线上地址更新 -->
</head>
<body>
  <button type="button" id="themeToggle" class="theme-toggle" aria-label="切换暗黑模式" title="切换暗黑模式">
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <main class="app">
    <div class="mode-switch">
      <p class="mode-status" id="modeStatus">当前模式：久坐上班族</p>
      <button type="button" id="modeSwitchBtn" class="mode-switch-btn">tap</button>
      <p class="mode-hint">点一下切换模式</p>
    </div>

    <header class="app-header">
      <h1>今日活动建议</h1>
      <p id="appDesc">输入久坐、睡眠、心率、步数，按固定规则给出今天最合适的活动安排。</p>
      <p class="app-sub" id="appSub">专为久坐上班族、学生设计。只需填入今日数据，获取你的专属活动建议。</p>
    </header>

    <section class="form-card" aria-label="输入数据">
      <div class="field" id="fieldSedentary">
        <label for="sedentary">久坐时长（小时）</label>
        <input type="number" id="sedentary" inputmode="decimal" placeholder="如 7" min="0" max="24" step="0.1" required>
      </div>
      <div class="field">
        <label for="sleep">睡眠时长（小时）</label>
        <input type="number" id="sleep" inputmode="decimal" placeholder="如 6.5" min="0" max="24" step="0.1" required>
      </div>
      <div class="field">
        <label for="hr">静息心率（次/分钟）</label>
        <input type="number" id="hr" inputmode="numeric" placeholder="如 65" min="30" max="250" step="1">
        <p class="field-hint">不知道就留空</p>
      </div>
      <div class="field">
        <label for="steps">每日步数（步）</label>
        <input type="number" id="steps" inputmode="numeric" placeholder="如 6000" min="0" max="100000" step="1" required>
      </div>
      <div class="demo-row">
        <button type="button" id="demoBtn" class="demo-btn">一键填入示例数据，立刻看看效果</button>
      </div>
      <button type="button" id="generateBtn">生成今天的建议</button>
      <p id="formError" class="form-error" role="alert" hidden></p>
    </section>

    <section class="result" id="result" hidden aria-live="polite">
      <div class="vitality">
        <div class="vitality-head">
          <span class="vitality-label">今日活力值</span>
          <span class="vitality-score" id="vitalityScore">-- / 100</span>
        </div>
        <div class="vitality-track" id="vitalityTrack" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="今日活力值">
          <div class="vitality-fill" id="vitalityFill"></div>
        </div>
      </div>
      <p class="risk-badge" id="riskBadge" role="status"></p>
      <div class="result-block">
        <h2>活动建议</h2>
        <p id="activityAdvice"></p>
      </div>
      <div class="result-block result-micro">
        <h2><svg class="micro-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.7 6.2 9a6.8 6.8 0 0 0 11.6 0L12 2.7z"/></svg>今日饮水目标</h2>
        <p id="hydrationAdvice"></p>
      </div>
      <div class="result-block result-micro">
        <h2><svg class="micro-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>微动作建议</h2>
        <p id="microAdvice"></p>
      </div>
      <div class="result-block result-taboo">
        <h2>绝对禁忌</h2>
        <p id="tabooAdvice"></p>
      </div>
      <div class="result-block">
        <h2>动作处方</h2>
        <p id="actionAdvice"></p>
      </div>
      <div class="result-block">
        <h2>营养提示</h2>
        <p id="nutritionAdvice"></p>
      </div>
      <div class="result-block">
        <h2>今天最该做的一件事</h2>
        <p id="keyAdvice"></p>
      </div>
      <!-- AI 私教模块：点击后把当前数据+基础建议发给 DeepSeek，返回内容展示在下方卡片 -->
      <div class="ai-section">
        <button type="button" id="aiBtn" class="ai-btn">🤖 听听AI私教怎么说</button>
        <div class="ai-card" id="aiCard" hidden>
          <p class="ai-title">🤖 AI 私教补充建议</p>
          <div class="ai-content" id="aiContent" aria-live="polite"></div>
        </div>
      </div>
      <button type="button" id="copyBtn" class="copy-btn">📋 复制建议</button>
      <button type="button" id="shareBtn" class="copy-btn">生成今日数据卡片</button>
    </section>

    <footer class="app-footer">
      <p>本工具只做固定规则判断，不构成医疗建议。</p>
      <p class="last-test" id="lastTest" hidden></p>
      <p><a href="about.html">关于这个工具</a></p>
      <p class="feedback">觉得有用？有问题或建议？联系我：<a href="mailto:2179369131@qq.com">2179369131@qq.com</a></p>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- 分享卡片：离屏完成截图下载 → 弹出预览 → 手动关闭 -->
    <div id="shareOverlay" class="share-overlay" aria-hidden="true">
      <button type="button" id="shareClose" class="share-close" aria-label="关闭预览">×</button>
      <div id="shareCard" class="share-card">
        <div class="share-card-inner">
          <p class="share-mode" id="shareMode"></p>
          <p class="share-title">今日活动建议</p>
          <div class="share-vitality">
            <span class="share-score" id="shareScore">--</span>
            <span class="share-score-unit">/ 100</span>
          </div>
          <p class="share-vitality-label">今日活力值</p>
          <p class="share-risk" id="shareRisk"></p>
          <div class="share-block">
            <h3>活动建议</h3>
            <p id="shareAdvice"></p>
          </div>
          <div class="share-block">
            <h3>今天最该做的一件事</h3>
            <p id="shareKey"></p>
          </div>
          <p class="share-date" id="shareDate"></p>
          <p class="share-url" id="shareUrl"></p>
        </div>
      </div>
    </div>
  </main>
  <script src="html2canvas.min.js" onerror="this.onerror=null;this.src='https://fastly.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'"></script>
  <script src="script.js?v=8"></script>
</body>
</html>
